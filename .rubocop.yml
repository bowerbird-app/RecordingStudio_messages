AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_messages.rb'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_messages.rb'
    - 'lib/recording_studio_messages/services/my_group_recordings.rb'
    - 'lib/recording_studio_messages/services/message_reads.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_messages/services/my_group_recordings.rb'
    - 'lib/recording_studio_messages/services/message_reads.rb'
    - 'lib/recording_studio_messages/services/send_message.rb'

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_messages/services/message_reads.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_messages/services/message_reads.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in leftover initialize methods
Lint/MissingSuper:
  Exclude:
    - 'test/**/*'
