name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recording_studio_messages_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
      env:
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
    
    - name: Install dummy app dependencies
      # Git clones into the hosted Ruby toolcache race. Keep the dummy
      # bundle in its own path, install one gem at a time, and retry.
      run: |
        bundle config set --local path vendor/bundle
        bundle config set --local jobs 1
        for attempt in 1 2 3; do
          if bundle install; then
            exit 0
          fi
          echo "bundle install failed on attempt ${attempt}"
          sleep $((attempt * 5))
        done
        exit 1
      working-directory: test/dummy
      env:
        BUNDLE_PATH: vendor/bundle
        BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_messages_test
    
    - name: Run database migrations
      run: bundle exec rake db:migrate RAILS_ENV=test
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_messages_test

    - name: Build dummy app Tailwind assets
      run: bundle exec rails tailwindcss:build
      working-directory: test/dummy
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_messages_test

    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run tests
      run: bundle exec rake test:all
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_messages_test
